<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  
  <nav class="campus-navbar">
    <div class="nav-container">
      
      <button class="nav-toggle" id="navToggle">
        <span></span>
        <span></span>
        <span></span>
      </button>
      
      <div class="nav-menu" id="navMenu">
        <ul class="nav-links">
          <li><a href="#home" class="nav-link">Home</a></li>
          <li><a href="#events" class="nav-link">Events</a></li>
          <li><a href="#club" class="nav-link">Your Club</a></li>
          <li><a href="#admin" class="nav-link">Admin</a></li>
          <li><a href="#profile" class="nav-link">Profile</a></li>
        </ul>
        <a href="#login" class="nav-login-btn">Login</a>
      </div>
    </div>
  </nav>
  
  <main id="app">
    <div class="text-center text-muted">Loading...</div>
  </main>
  
  <footer class="campus-footer">
    <small>© 2025 CampusConnect | All rights reserved</small>
  </footer>
  
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  
  <script>

    $(document).ready(function() {
      $('#navToggle').click(function() {
        $(this).toggleClass('active');
        $('#navMenu').toggleClass('active');
      });
      
      $('.nav-link').click(function() {
        $('#navToggle').removeClass('active');
        $('#navMenu').removeClass('active');
      });
    });
  </script>
</body>
</html>
