<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
   
    #spapp section {
      display: none;
    }
    #spapp section.active {
      display: block;
    }
  </style>
</head>
<body>

  <nav class="campus-navbar">
    <div class="nav-container">
      <button class="nav-toggle" id="navToggle">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="nav-menu" id="navMenu">
        <ul class="nav-links">
          <li><a href="#home" class="nav-link">Home</a></li>
          <li><a href="#events" class="nav-link">Events</a></li>
          <li><a href="#club" class="nav-link">Your Club</a></li>
          <li><a href="#admin" class="nav-link">Admin</a></li>
          <li><a href="#profile" class="nav-link">Profile</a></li>
        </ul>
        <a href="#login" class="nav-login-btn">Login</a>
      </div>
    </div>
  </nav>

  <main id="spapp">
    <section id="home" data-load="../views/home.html"></section>
    <section id="events" data-load="../views/events.html"></section>
    <section id="club" data-load="../views/club.html"></section>
    <section id="event-details" data-load="../views/event-details.html"></section>
    <section id="admin" data-load="../views/admin.html"></section>
    <section id="profile" data-load="../views/profile.html"></section>
    <section id="login" data-load="../views/login.html"></section>
    <section id="register" data-load="../views/register.html"></section>
  </main>


  <footer class="campus-footer">
    <small>© 2025 CampusConnect | All rights reserved</small>
  </footer>


  <script src="assets/js/jquery.min.js"></script>
  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/jquery.spapp.min.js"></script>
  <script src="assets/js/script.js"></script>

  <script>

    $(document).ready(function() {
      $('#navToggle').click(function() {
        $(this).toggleClass('active');
        $('#navMenu').toggleClass('active');
      });
      $('.nav-link').click(function() {
        $('#navToggle').removeClass('active');
        $('#navMenu').removeClass('active');
      });
    });
  </script> 
</body>
</html>
