<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    #spapp section {
      display: none;
    }
    #spapp section.active {
      display: block;
    }
    
    .user-menu {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .user-name {
      color: #fff;
      font-weight: 600;
    }
    .admin-only {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
  </style>
</head>
<body>

  <nav class="campus-navbar">
    <div class="nav-container">
      <button class="nav-toggle" id="navToggle">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="nav-menu" id="navMenu">
        <ul class="nav-links">
        </ul>
        <a href="#login" class="nav-login-btn" id="auth-btn">Login</a>
      </div>
    </div>
  </nav>

  <main id="spapp">
    <section id="home" data-load="../views/home.html"></section>
    <section id="events" data-load="../views/events.html"></section>
    <section id="club" data-load="../views/club.html"></section>
    <section id="event-details" data-load="../views/event-details.html"></section>
    <section id="admin" data-load="../views/admin.html"></section>
    <section id="profile" data-load="../views/profile.html"></section>
    <section id="login" data-load="../views/login.html"></section>
    <section id="register" data-load="../views/register.html"></section>
  </main>

  <footer class="campus-footer">
    <small>© 2025 CampusConnect | All rights reserved</small>
  </footer>

  <script src="assets/js/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/jquery.spapp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.blockUI/2.70/jquery.blockUI.min.js"></script>


  <script src="utils/constants.js"></script>
  <script src="utils/rest-client.js"></script>
  <script src="utils/utils.js"></script>
  
  <script src="services/user-service.js"></script>
  <script src="services/events-service.js"></script> 
  <script src="services/clubs-service.js"></script> 
  <script src="services/registrations-service.js"></script> 

  
  <script src="assets/js/script.js"></script>

</body>
</html>
