<div class="your-club-container">
    <div class="club-header-section">
      <div class="club-info">
        <div class="club-logo">
          <img src="assets/images/logo.jpg">
        </div>
        <div class="club-details">
          <h1 class="club-name">You do not have a Club</h1>
          <p class="club-description">Create your own today!</p>
          <div class="club-stats">
            <span class="stat-item">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="3" y="4" width="10" height="9" rx="1" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
                <line x1="3" y1="6" x2="13" y2="6" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
                <line x1="6" y1="2" x2="6" y2="5" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
                <line x1="10" y1="2" x2="10" y2="5" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
              </svg>
              <span id="events-count"></span>
            </span>
          </div>
        </div>
      </div>
      <button class="edit-club-btn" id="edit-club-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M12.5 2.5l3 3L6 15H3v-3L12.5 2.5z" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Edit Club
      </button>
    </div>

    <div class="tab-navigation">
      <button class="tab-btn active" data-tab="events">Your Events</button>
      <button class="tab-btn" data-tab="registrations">Registrations</button>
    </div>

    <div class="tab-content active" id="events-tab">
      <div class="section-header">
        <h2 class="section-title">Your Events</h2>
        <button class="add-btn" id="add-event-btn">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <line x1="10" y1="4" x2="10" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="4" y1="10" x2="16" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Add New Event
        </button>
      </div>

      <div class="club-events-grid" id="events-grid">
      </div>
    </div>

    <div class="tab-content" id="registrations-tab">
      <div class="section-header">
        <h2 class="section-title">Event Registrations</h2>
        <div class="filter-dropdown">
          <select class="event-filter" id="event-filter">
            <option value="all">All Events</option>
          </select>
        </div>
      </div>

      <div class="table-scroll-wrapper">
        <div class="registrations-table">
          <div class="table-header">
            <div class="table-col col-name">Name</div>
            <div class="table-col col-email">Email</div>
            <div class="table-col col-event">Event</div>
            <div class="table-col col-date">Registered</div>
          </div>
          
          <div id="registrations-tbody">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="club-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="club-modal-title">Edit Club</h3>
        <button class="close-btn" id="close-club-modal">&times;</button>
      </div>
      <form id="club-form">
        <div class="form-group">
          <label class="form-label">Club Name</label>
          <input 
            type="text" 
            class="form-input" 
            id="club-name" 
            name="name"
            placeholder="Enter club name" 
            required
            minlength="3"
            maxlength="200"
          >
        </div>
        <div class="form-group">
          <label class="form-label">Club Description</label>
          <textarea 
            class="form-input form-textarea" 
            id="club-description" 
            name="description"
            placeholder="Enter club description" 
            required
            minlength="10"
            maxlength="1000"
          ></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="submit-btn">Save Changes</button>
          <button type="button" class="cancel-btn cancel-club-modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

<div class="modal" id="event-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title" id="event-modal-title">Add New Event</h3>
      <button class="close-btn" id="close-event-modal">&times;</button>
    </div>
    <form id="event-form">
      <input type="hidden" id="event-id">

      <div class="form-group">
        <label class="form-label">Event Name</label>
        <input 
          type="text" 
          class="form-input" 
          id="event-name" 
          name="name"
          placeholder="Enter event name"
          required
          minlength="3"
          maxlength="200"
        >
      </div>

      <div class="form-group">
        <label class="form-label">Event Date</label>
        <input 
          type="date" 
          class="form-input" 
          id="event-date" 
          name="date"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea 
          class="form-input form-textarea" 
          id="event-description" 
          name="description"
          placeholder="Enter event description"
          maxlength="1000"
        ></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Location</label>
        <input 
          type="text" 
          class="form-input" 
          id="event-location" 
          name="location"
          placeholder="Enter event location"
          maxlength="200"
        >
      </div>

      <div class="form-actions">
        <button type="submit" class="submit-btn">Save Event</button>
        <button type="button" class="cancel-btn cancel-event-modal">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div id="delete-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="delete-modal-title">Delete Item</h2>
      <span class="close" id="close-delete-modal">&times;</span>
    </div>
    <div class="modal-body">
      <p id="delete-modal-message">Are you sure you want to delete this Event? This action cannot be undone.</p>
    </div>
    <div class="modal-footer">
      <button type="button" class="cancel-btn" id="cancel-delete-btn">Cancel</button>
      <button type="button" class="delete-btn" id="confirm-delete-btn">Delete</button>
    </div>
  </div>
</div>
