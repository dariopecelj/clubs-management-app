
  <div class="your-club-container">
    <div class="club-header-section">
      <div class="club-info">
        <div class="club-logo">
          <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=150&h=150&fit=crop" alt="Tech Club Logo">
        </div>
        <div class="club-details">
          <h1 class="club-name">Tech Innovation Club</h1>
          <p class="club-description">Building the future through technology and innovation</p>
          <div class="club-stats">
            <span class="stat-item">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="3" y="4" width="10" height="9" rx="1" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
                <line x1="3" y1="6" x2="13" y2="6" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
                <line x1="6" y1="2" x2="6" y2="5" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
                <line x1="10" y1="2" x2="10" y2="5" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
              </svg>
              12 Events
            </span>
          </div>
        </div>
      </div>
      <button class="edit-club-btn" id="edit-club-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M12.5 2.5l3 3L6 15H3v-3L12.5 2.5z" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Edit Club
      </button>
    </div>

    <div class="tab-navigation">
      <button class="tab-btn active" data-tab="events">Your Events</button>
      <button class="tab-btn" data-tab="registrations">Registrations</button>
    </div>

    <div class="tab-content active" id="events-tab">
      <div class="section-header">
        <h2 class="section-title">Your Events</h2>
        <button class="add-btn" id="add-event-btn">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <line x1="10" y1="4" x2="10" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="4" y1="10" x2="16" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Add New Event
        </button>
      </div>

      <div class="club-events-grid" id="events-grid">
      </div>
    </div>

    <div class="tab-content" id="registrations-tab">
      <div class="section-header">
        <h2 class="section-title">Event Registrations</h2>
        <div class="filter-dropdown">
          <select class="event-filter" id="event-filter">
            <option value="all">All Events</option>
          </select>
        </div>
      </div>

      <div class="table-scroll-wrapper">
        <div class="registrations-table">
          <div class="table-header">
            <div class="table-col col-name">Name</div>
            <div class="table-col col-email">Email</div>
            <div class="table-col col-event">Event</div>
            <div class="table-col col-date">Registered</div>
          </div>
          
          <div id="registrations-tbody">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Club Modal -->
  <div class="modal" id="club-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Edit Club</h3>
        <button class="close-btn" id="close-club-modal">&times;</button>
      </div>
      <form id="club-form">
        <div class="form-group">
          <label class="form-label">Club Name</label>
          <input type="text" class="form-input" id="club-name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-textarea" id="club-description" required></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Club Logo URL</label>
          <input type="url" class="form-input" id="club-logo" placeholder="https://example.com/logo.jpg">
        </div>
        <div class="form-actions">
          <button type="submit" class="submit-btn">Save Changes</button>
          <button type="button" class="cancel-btn cancel-club-modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add/Edit Event Modal -->
  <div class="modal" id="event-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="event-modal-title">Add New Event</h3>
        <button class="close-btn" id="close-event-modal">&times;</button>
      </div>
      <form id="event-form">
        <input type="hidden" id="event-id">
        <div class="form-group">
          <label class="form-label">Event Name</label>
          <input type="text" class="form-input" id="event-name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Event Date</label>
          <input type="date" class="form-input" id="event-date" required>
        </div>
        <div class="form-group">
          <label class="form-label">Event Image URL</label>
          <input type="url" class="form-input" id="event-image" placeholder="https://example.com/event.jpg">
        </div>
        <div class="form-group">
          <label class="form-label">Registered Count</label>
          <input type="number" class="form-input" id="event-registered" min="0" value="0" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="submit-btn">Save Event</button>
          <button type="button" class="cancel-btn cancel-event-modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>
