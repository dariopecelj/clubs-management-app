<div class="profile-container">
  <div class="profile-header-section">
    <div class="profile-info">
      <div class="profile-avatar">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&h=150&fit=crop" alt="Profile Picture" id="profile-pic">
      </div>
      <div class="profile-details">
        <h1 class="profile-name" id="profile-name">John Doe</h1>
        <p class="profile-email" id="profile-email">john.doe@university.edu</p>
        <div class="profile-meta">
          <span class="meta-item">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M8 1L2 4.5V11.5L8 15L14 11.5V4.5L8 1Z" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <span id="profile-id">ID: 12345</span>
          </span>
        </div>
      </div>
    </div>
    <button class="edit-profile-btn" id="edit-profile-btn">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M12.5 2.5l3 3L6 15H3v-3L12.5 2.5z" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Edit Profile
    </button>
  </div>


  <div class="clubs-section">
    <div class="section-header">
      <h2 class="section-title">Your Clubs</h2>
      <span class="clubs-count" id="clubs-count">3 clubs</span>
    </div>
    <div class="user-clubs-grid" id="clubs-grid">

    </div>
  </div>


  <div class="events-section">
    <div class="section-header">
      <h2 class="section-title">Your Events</h2>
      <span class="events-count" id="events-count">5 events</span>
    </div>
    
    <div class="table-scroll-wrapper">
      <div class="data-table events-table">
        <div class="table-header">
          <div>Event Name</div>
          <div>Club</div>
          <div>Date</div>
        </div>
        <div id="events-tbody">
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="profile-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title">Edit Profile</h3>
      <button class="close-btn" id="close-profile-modal">&times;</button>
    </div>
    <form id="profile-form">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-input" id="edit-name" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="edit-email" required>
      </div>
      <div class="form-divider">
        <span>Change Password</span>
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" class="form-input" id="new-password" placeholder="Leave blank if not changing">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input type="password" class="form-input" id="confirm-password" placeholder="Leave blank if not changing">
      </div>
      <div class="form-actions">
        <button type="submit" class="submit-btn">Save Changes</button>
        <button type="button" class="cancel-btn cancel-profile-modal">Cancel</button>
      </div>
    </form>
  </div>
</div>
